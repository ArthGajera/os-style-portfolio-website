    status.innerHTML = `<span class="pulse" aria-hidden="true"></span><span>${esc(st.label)}</span>`;

    $("#tabs").innerHTML = SECTIONS.map((s) => `<li><button class="tab" data-win="${s.id}" aria-current="false">${s.title}</button></li>`).join("");
    $("#tabs").addEventListener("click", (e) => { const b = e.target.closest(".tab"); if (b) openWin(b.dataset.win); });
    $("#brand").addEventListener("click", openPalette);
    $("#tray-search").addEventListener("click", openPalette);

    const dock = $("#dock");
    dock.innerHTML =
      SECTIONS.map((s) => `<li><button class="dock-btn" data-win="${s.id}" aria-label="${s.title}" aria-pressed="false" data-tip="${s.title}">${icon(s.icon)}<span class="dock-label" aria-hidden="true">${s.title}</span><span class="dock-dot" aria-hidden="true"></span></button></li>`).join("") +
      `<li class="dock-sep" aria-hidden="true"></li><li><button class="dock-btn" data-action="resume" aria-label="Download resume" data-tip="Resume">${icon("file")}<span class="dock-label" aria-hidden="true">Resume</span></button></li>`;
    dock.addEventListener("click", (e) => {
      const b = e.target.closest(".dock-btn");
      if (!b) return;
      if (b.dataset.action === "resume") downloadResume();
      else toggleFromDock(b.dataset.win);
    });
    const btns = [...dock.querySelectorAll(".dock-btn")];
    dock.addEventListener("pointermove", (e) => {
      if (isMobile() || reduced() || e.pointerType !== "mouse") return;
      btns.forEach((b) => {
        const r = b.parentElement.getBoundingClientRect();
        const d = Math.abs(e.clientX - (r.left + r.width / 2));
        b.style.setProperty("--s", (1 + 0.5 * Math.max(0, 1 - d / 130)).toFixed(3));
      });
    });
    dock.addEventListener("pointerleave", () => btns.forEach((b) => b.style.setProperty("--s", "1")));

    const [pre, accent] = (() => {
      const h = PROFILE.headline, a = PROFILE.headlineAccent;
      return a && h.endsWith(a) ? [h.slice(0, -a.length), a] : [h, ""];
    })();
    $("#hero").innerHTML = `
      <p class="kicker reveal" style="--d:0"><span class="pulse" aria-hidden="true"></span>${esc(PROFILE.name)} · ${esc(PROFILE.role)}</p>
      <h1 id="hero-title" class="reveal" style="--d:1">${esc(pre)}<span class="grad">${esc(accent)}</span></h1>
      <p class="sub reveal" style="--d:2">${esc(PROFILE.subheadline)}</p>
      <div class="ctas reveal" style="--d:3">
        <button class="btn btn-primary" data-open="work">View Projects ${icon("arrow", 16)}</button>
        <button class="btn btn-ghost" data-open="contact">Contact</button>
      </div>
      <div class="stats reveal" style="--d:4">
        <div class="stat"><b>${PROJECTS.length}</b><span>Projects</span></div>
        <div class="stat"><b>${ALL_SKILLS.length}</b><span>Skills</span></div>
        <div class="stat"><b>${PROFILE.yearsExperience}+</b><span>Years</span></div>
      </div>
      <p class="hint reveal" style="--d:5">Press <kbd>${isMac ? "⌘" : "Ctrl"}</kbd><kbd>K</kbd> to jump anywhere</p>`;
    $("#hero").addEventListener("click", (e) => { const b = e.target.closest("[data-open]"); if (b) openWin(b.dataset.open); });

    const c = PROFILE.currently;
    if (c) $("#widget").innerHTML = `<h2><span>${esc(c.label)}</span><span>${c.progress ?? ""}%</span></h2><p>${esc(c.text)}</p><div class="bar" role="progressbar" aria-valuenow="${c.progress}" aria-valuemin="0" aria-valuemax="100" aria-label="Progress"><i style="--p:${c.progress}%"></i></div>`;
    else $("#widget").hidden = true;
  }

  function startClock() {
    const el = $("#clock");
    const tick = () => {
      const d = new Date();
      el.textContent = d.toLocaleDateString(undefined, { weekday: "short" }) + " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
      el.setAttribute("datetime", d.toISOString());
    };
    tick();
    setTimeout(() => { tick(); setInterval(tick, 1000 * 15); }, (60 - new Date().getSeconds()) * 1000);
  }

  /* =====================================================================
     Living background: node graph with mouse parallax
     ===================================================================== */
  function startBackground() {
    const canvas = $("#bg");
    const ctx = canvas.getContext("2d");
    let w = 0, h = 0, nodes = [], raf = 0;
    const mouse = { x: 0.5, y: 0.5, tx: 0.5, ty: 0.5, px: -9999, py: -9999 };
    const LINK = 140;

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      w = innerWidth; h = innerHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      canvas.style.width = w + "px"; canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.round(clamp((w * h) / 15000, 30, 120));
      nodes = Array.from({ length: count }, () => ({
        x: Math.random() * w, y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.16, vy: (Math.random() - 0.5) * 0.16,
        z: Math.random() * 0.85 + 0.15, c: Math.random() < 0.62 ? "255,255,255" : "170,170,170", ph: Math.random() * 6.28
      }));
      if (reduced()) draw(0);
    }
    function draw(t) {
      ctx.clearRect(0, 0, w, h);
      mouse.x += (mouse.tx - mouse.x) * 0.05;
      mouse.y += (mouse.ty - mouse.y) * 0.05;
      const px = (mouse.x - 0.5) * -60, py = (mouse.y - 0.5) * -60;
      const P = nodes.map((n) => {
        if (!reduced()) {
          n.x += n.vx; n.y += n.vy;
          if (n.x < -40) n.x = w + 40; else if (n.x > w + 40) n.x = -40;
          if (n.y < -40) n.y = h + 40; else if (n.y > h + 40) n.y = -40;
        }
        return [n.x + px * n.z, n.y + py * n.z];
      });
      ctx.lineWidth = 0.7;
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dx = P[i][0] - P[j][0], dy = P[i][1] - P[j][1];
          const d2 = dx * dx + dy * dy;
          if (d2 > LINK * LINK) continue;
          const a = (1 - Math.sqrt(d2) / LINK) * 0.28 * Math.min(nodes[i].z, nodes[j].z);
          ctx.strokeStyle = `rgba(${nodes[i].c},${a.toFixed(3)})`;
          ctx.beginPath(); ctx.moveTo(P[i][0], P[i][1]); ctx.lineTo(P[j][0], P[j][1]); ctx.stroke();
        }
        const mdx = P[i][0] - mouse.px, mdy = P[i][1] - mouse.py;
        const md = Math.hypot(mdx, mdy);
        if (md < 200) {
          ctx.strokeStyle = `rgba(${nodes[i].c},${((1 - md / 200) * 0.55).toFixed(3)})`;
          ctx.beginPath(); ctx.moveTo(P[i][0], P[i][1]); ctx.lineTo(mouse.px, mouse.py); ctx.stroke();
        }
      }
      for (let i = 0; i < nodes.length; i++) {
        const n = nodes[i];
        const glow = 0.55 + 0.45 * Math.sin(t * 0.0015 + n.ph);
        ctx.fillStyle = `rgba(${n.c},${(0.35 + 0.55 * n.z * glow).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(P[i][0], P[i][1], 0.8 + n.z * 1.8, 0, 6.283); ctx.fill();
      }
    }
    function loop(t) { draw(t); raf = requestAnimationFrame(loop); }
    function start() { cancelAnimationFrame(raf); if (!reduced() && !document.hidden) raf = requestAnimationFrame(loop); else draw(0); }

    addEventListener("resize", resize);
    document.addEventListener("visibilitychange", start);
    reduceMQ.addEventListener?.("change", start);

    const glow = $("#cursor-glow");
    let gx = innerWidth / 2, gy = innerHeight / 2, tx = gx, ty = gy, glowRaf = 0;
    const glowLoop = () => {
      gx += (tx - gx) * 0.18; gy += (ty - gy) * 0.18;
      glow.style.transform = `translate3d(${gx}px,${gy}px,0)`;
      glowRaf = Math.abs(tx - gx) + Math.abs(ty - gy) > 0.5 ? requestAnimationFrame(glowLoop) : 0;
    };
    addEventListener("pointermove", (e) => {
      if (e.pointerType !== "mouse") return;
      document.body.classList.add("has-pointer");
      mouse.tx = e.clientX / w; mouse.ty = e.clientY / h;
      mouse.px = e.clientX; mouse.py = e.clientY;
      tx = e.clientX; ty = e.clientY;
      if (!glowRaf && !reduced()) glowRaf = requestAnimationFrame(glowLoop);
      if (reduced()) draw(0);
    }, { passive: true });
    document.addEventListener("pointerleave", () => { document.body.classList.remove("has-pointer"); mouse.px = mouse.py = -9999; });

    resize();
    start();
  }

  /* =====================================================================
     Boot sequence (first load per session)
     ===================================================================== */
  function boot() {
    const el = $("#boot");
    let seen = false;
    try { seen = sessionStorage.getItem("nova-booted") === "1"; sessionStorage.setItem("nova-booted", "1"); } catch {}
    if (seen || reduced()) return;
    document.documentElement.style.setProperty("--boot-delay", "1900ms");
    el.hidden = false;
    const log = $("#boot-log"), bar = $("#boot-bar");
    const lines = [
      ["0.000", `${CONFIG.site.name} kernel ${CONFIG.site.version} — initializing`, ""],
      ["0.118", `mounting /projects ${".".repeat(10)} ${PROJECTS.length} entries`, "ok"],
      ["0.231", `loading skill graph ${".".repeat(9)} ${SKILL_CATS.length} clusters`, "ok"],
      ["0.342", "calibrating spatial renderer", "ok"],
      ["0.457", "neural mesh online", "hl"],
      ["", `> welcome, visitor`, "hl"]
    ];
    let i = 0, done = false;
    const finish = () => {
      if (done) return;
      done = true;
      bar.style.width = "100%";
      document.documentElement.style.setProperty("--boot-delay", "0ms");
      el.classList.add("done");
      setTimeout(() => (el.hidden = true), 650);
      removeEventListener("keydown", finish);
      el.removeEventListener("click", finish);
    };
    const step = () => {
      if (done) return;
      if (i >= lines.length) { setTimeout(finish, 280); return; }
      const [t, txt, cls] = lines[i++];
      const li = document.createElement("li");
      li.innerHTML = `${t ? `<span>[${t}]</span> ` : ""}<span class="${cls}">${esc(txt)}</span>${cls === "ok" ? ' <span class="ok">ok</span>' : ""}`;
      log.appendChild(li);
      bar.style.width = `${(i / lines.length) * 100}%`;
      setTimeout(step, 230);
    };
    addEventListener("keydown", finish);
    el.addEventListener("click", finish);
    setTimeout(step, 200);
  }

  /* ---------- Init ---------- */
  boot();
  renderChrome();
  SECTIONS.forEach(buildWindow);
  buildPaletteItems();
  syncUI();
  startClock();
  startBackground();
})();
</script>
</body>
